[ui]
default-command = "log"
conflict-marker-style = "git"
color = "auto"
paginate = "auto"

[git]
push-bookmark-prefix = "anpe/"

[aliases]
# Alias to fetch latest changes and then run 'jj new' on the provided argument.
# Usage: jj switch <branch>
# e.g., jj switch main@origin
switch = [
  "util",
  "exec",
  "--", # Core command to execute an external script/command
  "bash",
  "-c", # Use bash to execute the following inline script
  """
#!/usr/bin/env bash
set -euo pipefail # Exit on error, undefined variable, or pipe failure

# First, fetch all remote updates
echo "Fetching latest changes..."
jj git fetch

# Check if @origin is already part of the argument
if [[ "$1" != *@origin ]]; then
  echo "Appending @origin to the argument..."
  set -- "$1@origin"
fi

# Then, create a new change based on the provided target revision
echo "Creating new change on '$@'..."
jj new "$1"

echo "Successfully switched. Current change is now based on the latest '$@'."
""",
  "$1",
]

# Rebase alias to rebase @ on origin of provided branch or revset.
# Usage: jj rb <branch> e.g. jj rb main -> jj jj rebase -s @ -d main@origin
rb = [
  "util",
  "exec",
  "--", # Core command to execute an external script/command
  "bash",
  "-c", # Use bash to execute the following inline script
  """
  #!/usr/bin/env bash
set -euo pipefail # Exit on error, undefined variable, or pipe failure
# Check if the user provided an argument
if [ $# -eq 0 ]; then
  echo "Usage: jj rb <branch>"
  exit 1
fi
# Extract the first argument
branch="$1"
# Check if the argument ends with @origin, if not, append it
if [[ "$branch" != *@origin ]]; then
  branch="$branch@origin"
fi
# Perform the rebase operation
jj rebase -s @ -d "$branch"
""",
  "$1",
]


# in a standard git repo init jj. So check if .jj exists and if not, initialize it.
setup = [
  "util",
  "exec",
  "--", # Core command to execute an external script/command
  "bash",
  "-c", # Use bash to execute the following inline script
  """
#!/usr/bin/env bash
set -euo pipefail # Exit on error, undefined variable, or pipe failure
# Check if .jj directory exists
if [ ! -d ".jj" ]; then
  echo "Initializing jj in the current directory..."
  jj git init --colocate
else
  echo ".jj already exists, skipping initialization."
fi
""",
]

todo = [
  "util",
  "exec",
  "--", # Core command to execute an external script/command
