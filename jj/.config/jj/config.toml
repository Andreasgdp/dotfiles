newpush = [
  "util",
  "exec",
  "--", # Core command to execute an external script/command
  "bash",
  "-c", # Use bash to execute the following inline script
  """
#!/usr/bin/env bash
set -euo pipefail # Exit on error, undefined variable, or pipe failure
jj git push --allow-new --remote origin
""",
]

# "prmaster <branch_name>" alias  - should, grab all the commit messages from the diff between origin master and origin <branch_name> store in var, jj new, then git switch master, git pull, create new tmp-<some_unique_id> branch, git merge --squash <branch_name>, git commit with all the commit messages stored (note if not already the first commit should be on top), jj edit tmp-<some_unique_id>, jj pr
prmaster = [
  "util",
  "exec",
  "--", # Core command to execute an external script/command
  "bash",
  "-c", # Use bash to execute the following inline script
  """
#!/usr/bin/env bash
set -euo pipefail # Exit on error, undefined variable, or pipe failure
# Check if the user provided an argument
if [ $# -eq 0 ]; then
  echo "Usage: jj prmaster <branch_name>"
  exit 1
fi
# Extract the first argument
branch="$1"

# Check if the argument ends with @origin, if not, append it
# if [[ "$branch" != *@origin ]]; then
#   branch="$branch@origin"
# fi

# check if the branch exists in origin
if ! git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
  echo "Error: Branch 'origin/$branch' does not exist."
  exit 1
fi

# jj switch to the specified branch
echo "Switching to branch: $branch..."
jj switch "$branch" || {
  echo "Error: Failed to switch to branch '$branch'."
  exit 1
}

# gather all the commit messages (full content including headers and bodies) from the diff between origin master and origin <branch_name>
commit_messages=$(git log origin/master..origin/"$branch" --reverse --pretty=format:"%s%n%b" | sed 's/^/  /') # indent each line with 2 spaces
if [ -z "$commit_messages" ]; then
  echo "No commits found between origin/master and origin/$branch."
  exit 0
fi
# Create a new change
#echo "Creating a new change based on the latest origin/$branch..."
#jj new # this is just so git does not see changes in staging area and will allow git operations from here
# Switch to master branch
echo "Switching to master branch..."
git switch master || {
  echo "Error: Failed to switch to master branch. It might not exist."
  exit 1
}
# Pull the latest changes from origin master
echo "Pulling latest changes from origin master..."
git pull origin master || {
  echo "Error: Failed to pull latest changes from origin master."
  exit 1
}
# Create a new temporary branch with a unique name
tmp_branch="tmp-$(date +%s)"
echo "Creating a new temporary branch: $tmp_branch..."
git checkout -b "$tmp_branch" || {
  echo "Error: Failed to create temporary branch."
  exit 1
}
# Merge the changes from the specified branch into the temporary branch with squash
echo "Merging changes from origin/$branch into $tmp_branch with squash..."
git merge --squash "origin/$branch" || {
  echo "Error: Failed to merge changes from origin/$branch."
  exit 1
}
 
# Commit the changes with all the commit messages
echo "Committing the changes with all commit messages..."
if [ -n "$commit_messages" ]; then
  git commit -m "$commit_messages"
else
  git commit -m "Merged changes from origin/$branch"
fi
# Edit the commit message using jj
echo "Editing the commit message using jj..."
jj edit $tmp_branch || {
  echo "Error: Failed attacj jj to the temporary branch."
  exit 1
}
jj pr || {
  echo "Error: Failed to create a pull request structured branch."
  exit 1
}
echo "Pull request structured branch created successfully: $tmp_branch."
# forget the temporary branch
jj b f "$tmp_branch" || {
  echo "Error: Failed to forget the temporary branch."
  exit 1
}
""",
  "$1",
]
