# should check for commit message. Ensure here is a jira ticket id in the commit message e.g. CT-1234 or UR-1234 or EP-14 or the likes some commit message
# Ensure there is a +patch, +minor, or +major in the commit message
# set the current bookmark to be pr/main/<ticket-id>-anpe-<first line of commit message ofrmatted to lowercase and with spaces replaced by dashes as well as remove special characters like :>
pr = [
  "util",
  "exec",
  "--", # Core command to execute an external script/command
  "bash",
  "-c", # Use bash to execute the following inline script
  """#!/usr/bin/env bash
set -euo pipefail # Exit on error, undefined variable, or pipe failure

# get the actual commit message only, using jj
# NOTE the commit message is tabbed in slightly where all other lines are not, so we can locate the commit message easily based on that
# commit_message=$(jj show -s | grep '^[[:space:]]' | xargs -I {} echo "{}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
commit_message=$(jj show -s | grep '^[[:space:]]' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
echo "commit_message: \n$commit_message"

# Check if the commit message contains a JIRA ticket ID and a patch level
if ! echo $commit_message | grep -qE '([A-Z]{1,5}-[0-9]+)'; then
  echo "Error: Commit message must contain a JIRA ticket ID (e.g., CT-1234, UR-1234, EP-14)."
  exit 1
fi
if ! echo $commit_message | grep -qE '(\\+patch|\\+minor|\\+major)'; then
  echo "Error: Commit message must contain a +patch, +minor, or +major."
  exit 1
fi

# Extract the first line of the commit message before first newline
first_line=$(jj show -s | grep '^[[:space:]]' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | head -n1)

echo "First line of commit message: $first_line"
  
# check if there is an actual commit message before the ticket id and patch level
if ! echo "$first_line" | grep -qE '[^[:space:]]'; then
  echo "Error: Commit message must not be empty."
  exit 1
fi
  
# check if first line is not just the ticket id and/or patch level
if echo "$first_line" | grep -qE '^[[:space:]]*([A-Z]{2,}-[0-9]+|[A-Z]{2,}[0-9]+|\\+patch|\\+minor|\\+major)[[:space:]]*$'; then
  echo "Error: Commit message must contain a descriptive first line."
  exit 1
fi

# Extract the JIRA ticket ID from the commit message
# This regex captures the first occurrence of a JIRA ticket ID pattern
ticket_id=$(jj show -s | grep '^[[:space:]]' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -oE '([A-Z]{2,}-[0-9]+|[A-Z]{2,}[0-9]+)' | head -n 1)

# Format the first line to lowercase, replace spaces with dashes, and remove special characters
formatted_line=$(echo "$first_line" | tr '[:upper:]' '[:lower:]' | tr ' ' '-' | tr -cd '[:alnum:]-')
pr_name="pr/main/${ticket_id}-anpe-${formatted_line}"
echo "Setting bookmark to: $pr_name"
# Set the current bookmark to pr/main/<ticket-id>-anpe-<formatted-line>
jj bookmark set --revision=@ "$pr_name" || {
  echo "Error: Failed to set bookmark. It might already exist."
  exit 1
}
echo "Current bookmark set to pr/main/${ticket_id}-anpe-${formatted_line}."
""",
]

