id = "local.tab-index-labels"
name = "Tab Index Labels"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Keep tab labels prefixed with their current workspace-local index."
platforms = ["macos", "linux"]

[[events]]
on = "tab.created"
command = ["./sync-on-event.sh"]

[[events]]
on = "tab.closed"
command = ["./sync-on-event.sh"]

[[events]]
on = "tab.renamed"
command = ["./sync-on-event.sh"]

[[events]]
on = "pane.exited"
command = ["./sync-on-event.sh"]

[[events]]
on = "workspace.created"
command = ["./sync-on-event.sh"]
